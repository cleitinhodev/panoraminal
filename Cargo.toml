[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["cleitinhodev / bugzinho <https://www.bugzinho.com/>"]
repository = "https://github.com/cleitinhodev/panoraminal"
homepage = "https://www.bugzinho.com/"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
chunks_exact_to_as_chunks = "allow"
manual_checked_ops = "allow"
new_without_default = "allow"
